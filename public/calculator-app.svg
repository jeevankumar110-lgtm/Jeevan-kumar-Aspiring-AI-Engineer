<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="calc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141517"/>
      <stop offset="100%" stop-color="#0E0F10"/>
    </linearGradient>
    <linearGradient id="calc-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1E22"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="btn-num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26282E"/>
      <stop offset="100%" stop-color="#1F2025"/>
    </linearGradient>
    <linearGradient id="btn-op" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D3342"/>
      <stop offset="100%" stop-color="#222733"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#calc-bg)"/>

  <!-- Blueprint Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="480" y1="60" x2="480" y2="440"/>
  </g>

  <!-- Metadata -->
  <text x="35" y="40" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8AB4F8" letter-spacing="1.5">PROJECT 02 // WEB-BASED COMPUTATIONAL ENGINE</text>
  <text x="590" y="40" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9AA0A6">[ HTML5 • CSS3 • JAVASCRIPT ]</text>

  <!-- Center Left: Calculator Hardware / UI Box -->
  <g transform="translate(100, 75)">
    <!-- Calculator Body -->
    <rect width="320" height="350" rx="12" fill="url(#calc-body)" stroke="#33373E" stroke-width="1.5"/>

    <!-- Top Status Pill & Window controls -->
    <circle cx="24" cy="20" r="4.5" fill="#EF4444"/>
    <circle cx="39" cy="20" r="4.5" fill="#F59E0B"/>
    <circle cx="54" cy="20" r="4.5" fill="#10B981"/>
    <text x="160" y="23" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71767D" text-anchor="middle">CALCULATOR.JS // V1.0</text>

    <!-- LCD Display -->
    <rect x="20" y="38" width="280" height="68" rx="6" fill="#0C0D0E" stroke="#232529"/>
    <text x="285" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71767D" text-anchor="end">1,024 × 2 + 50.5</text>
    <text x="285" y="94" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="end">2,098.5</text>

    <!-- Keypad Grid -->
    <!-- Row 1: AC, +/-, %, ÷ -->
    <g transform="translate(20, 118)">
      <rect x="0" y="0" width="62" height="40" rx="4" fill="#36292B" stroke="#4D2E32"/>
      <text x="31" y="25" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="middle">AC</text>

      <rect x="72" y="0" width="62" height="40" rx="4" fill="url(#btn-op)" stroke="#394254"/>
      <text x="103" y="25" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#8AB4F8" text-anchor="middle">±</text>

      <rect x="144" y="0" width="62" height="40" rx="4" fill="url(#btn-op)" stroke="#394254"/>
      <text x="175" y="25" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#8AB4F8" text-anchor="middle">%</text>

      <rect x="216" y="0" width="64" height="40" rx="4" fill="#2C3A54" stroke="#4869A8"/>
      <text x="248" y="25" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#8AB4F8" text-anchor="middle">÷</text>
    </g>

    <!-- Row 2: 7, 8, 9, × -->
    <g transform="translate(20, 166)">
      <rect x="0" y="0" width="62" height="40" rx="4" fill="url(#btn-num)" stroke="#2B2D33"/>
      <text x="31" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E3E3E3" text-anchor="middle">7</text>

      <rect x="72" y="0" width="62" height="40" rx="4" fill="url(#btn-num)" stroke="#2B2D33"/>
      <text x="103" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E3E3E3" text-anchor="middle">8</text>

      <rect x="144" y="0" width="62" height="40" rx="4" fill="url(#btn-num)" stroke="#2B2D33"/>
      <text x="175" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E3E3E3" text-anchor="middle">9</text>

      <rect x="216" y="0" width="64" height="40" rx="4" fill="#2C3A54" stroke="#4869A8"/>
      <text x="248" y="25" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#8AB4F8" text-anchor="middle">×</text>
    </g>

    <!-- Row 3: 4, 5, 6, − -->
    <g transform="translate(20, 214)">
      <rect x="0" y="0" width="62" height="40" rx="4" fill="url(#btn-num)" stroke="#2B2D33"/>
      <text x="31" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E3E3E3" text-anchor="middle">4</text>

      <rect x="72" y="0" width="62" height="40" rx="4" fill="url(#btn-num)" stroke="#2B2D33"/>
      <text x="103" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E3E3E3" text-anchor="middle">5</text>

      <rect x="144" y="0" width="62" height="40" rx="4" fill="url(#btn-num)" stroke="#2B2D33"/>
      <text x="175" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E3E3E3" text-anchor="middle">6</text>

      <rect x="216" y="0" width="64" height="40" rx="4" fill="#2C3A54" stroke="#4869A8"/>
      <text x="248" y="25" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#8AB4F8" text-anchor="middle">−</text>
    </g>

    <!-- Row 4: 1, 2, 3, + -->
    <g transform="translate(20, 262)">
      <rect x="0" y="0" width="62" height="40" rx="4" fill="url(#btn-num)" stroke="#2B2D33"/>
      <text x="31" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E3E3E3" text-anchor="middle">1</text>

      <rect x="72" y="0" width="62" height="40" rx="4" fill="url(#btn-num)" stroke="#2B2D33"/>
      <text x="103" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E3E3E3" text-anchor="middle">2</text>

      <rect x="144" y="0" width="62" height="40" rx="4" fill="url(#btn-num)" stroke="#2B2D33"/>
      <text x="175" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E3E3E3" text-anchor="middle">3</text>

      <rect x="216" y="0" width="64" height="40" rx="4" fill="#2C3A54" stroke="#4869A8"/>
      <text x="248" y="25" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#8AB4F8" text-anchor="middle">+</text>
    </g>

    <!-- Row 5: 0, ., = -->
    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="134" height="32" rx="4" fill="url(#btn-num)" stroke="#2B2D33"/>
      <text x="67" y="21" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E3E3E3" text-anchor="middle">0</text>

      <rect x="144" y="0" width="62" height="32" rx="4" fill="url(#btn-num)" stroke="#2B2D33"/>
      <text x="175" y="21" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E3E3E3" text-anchor="middle">.</text>

      <rect x="216" y="0" width="64" height="32" rx="4" fill="#8AB4F8"/>
      <text x="248" y="21" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#131314" text-anchor="middle">=</text>
    </g>
  </g>

  <!-- Right Side: Architecture & Features Specs Panel -->
  <g transform="translate(460, 75)">
    <rect width="305" height="350" rx="8" fill="#17181C" stroke="#2A2C31"/>
    
    <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#8AB4F8">ENGINE SPECIFICATIONS</text>
    <line x1="24" y1="48" x2="280" y2="48" stroke="#2A2C31"/>

    <g font-family="'Space Grotesk', sans-serif" font-size="12" fill="#D1D5DB">
      <text x="24" y="75" font-weight="600" fill="#FFFFFF">• Pure Client Arithmetic</text>
      <text x="36" y="94" font-size="11" fill="#9AA0A6">Executes 4 core operators (+, −, ×, ÷) with operator precedence.</text>

      <text x="24" y="130" font-weight="600" fill="#FFFFFF">• Decimal Floating-Point</text>
      <text x="36" y="149" font-size="11" fill="#9AA0A6">Full support for decimal fractions and multi-digit operations.</text>

      <text x="24" y="185" font-weight="600" fill="#FFFFFF">• Display Clear &amp; Reset</text>
      <text x="36" y="204" font-size="11" fill="#9AA0A6">One-touch clear (AC) to reinitialize accumulator state.</text>

      <text x="24" y="240" font-weight="600" fill="#FFFFFF">• Defensive Error Handling</text>
      <text x="36" y="259" font-size="11" fill="#9AA0A6">Traps division-by-zero &amp; malformed inputs gracefully.</text>

      <text x="24" y="295" font-weight="600" fill="#FFFFFF">• Tactile DOM Interactions</text>
      <text x="36" y="314" font-size="11" fill="#9AA0A6">Event-driven button feedback with instant LCD updates.</text>
    </g>
  </g>

  <!-- Bottom Tag -->
  <text x="35" y="468" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5F6368">&gt; SYSTEM: Web-Based Calculator • Pure JavaScript DOM Evaluation Engine</text>
</svg>
