<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0A0A0A"/>
  <!-- Subtle Swiss Grid -->
  <line x1="0" y1="100" x2="600" y2="100" stroke="#222" stroke-width="1"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="#222" stroke-width="1"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#222" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="#222" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="400" stroke="#222" stroke-width="1"/>
  
  <!-- Content -->
  <text x="40" y="60" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#888" letter-spacing="3">JK // 01 — SYSTEM LOGIC</text>
  <text x="500" y="60" font-family="monospace" font-size="11" fill="#666">[ AGE &gt;= 18 ]</text>
  
  <!-- Interactive-looking UI element -->
  <rect x="60" y="110" width="480" height="230" rx="4" fill="#141414" stroke="#2E2E2E" stroke-width="1"/>
  
  <!-- Terminal Header -->
  <circle cx="85" cy="130" r="4" fill="#333"/>
  <circle cx="100" cy="130" r="4" fill="#333"/>
  <circle cx="115" cy="130" r="4" fill="#333"/>
  <text x="140" y="134" font-family="monospace" font-size="11" fill="#777">voter_check.py</text>
  <line x1="60" y1="148" x2="540" y2="148" stroke="#252525" stroke-width="1"/>
  
  <!-- Code lines & Logic Visual -->
  <text x="85" y="180" font-family="monospace" font-size="13" fill="#888888">def check_eligibility(age):</text>
  <text x="110" y="205" font-family="monospace" font-size="13" fill="#D4D4D0">    if age &gt;= 18:</text>
  <text x="135" y="230" font-family="monospace" font-size="13" fill="#FFFFFF">        return "Eligible to Vote: VERIFIED"</text>
  <text x="110" y="255" font-family="monospace" font-size="13" fill="#777777">    else: return "Underage"</text>
  
  <!-- Badge -->
  <rect x="85" y="280" width="160" height="32" rx="2" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
  <circle cx="102" cy="296" r="3" fill="#E5E5E5"/>
  <text x="115" y="300" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#E5E5E5" letter-spacing="1">STATUS: ACTIVE</text>
</svg>

