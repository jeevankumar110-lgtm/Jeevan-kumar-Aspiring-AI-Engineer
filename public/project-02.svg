<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0A0A0A"/>
  <!-- Swiss Grid -->
  <line x1="0" y1="100" x2="600" y2="100" stroke="#222" stroke-width="1"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="#222" stroke-width="1"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#222" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#222" stroke-width="1"/>
  
  <text x="40" y="60" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#888" letter-spacing="3">JK // 02 — ARITHMETIC ENGINE</text>
  <text x="480" y="60" font-family="monospace" font-size="11" fill="#666">[ OPS: + - * / % ]</text>

  <!-- Calculator Minimal Interface -->
  <rect x="170" y="95" width="260" height="260" rx="4" fill="#141414" stroke="#2E2E2E" stroke-width="1"/>
  
  <!-- Display Screen -->
  <rect x="190" y="115" width="220" height="48" rx="2" fill="#0E0E0E" stroke="#262626" stroke-width="1"/>
  <text x="395" y="147" font-family="'Space Grotesk', monospace" font-size="22" font-weight="600" fill="#F0F0EC" text-anchor="end">3,141.59</text>
  
  <!-- Keys Grid -->
  <!-- Row 1 -->
  <rect x="190" y="175" width="48" height="34" rx="2" fill="#202020" stroke="#333" stroke-width="0.5"/>
  <text x="214" y="196" font-family="monospace" font-size="11" fill="#FFF" text-anchor="middle">C</text>
  <rect x="247" y="175" width="48" height="34" rx="2" fill="#202020" stroke="#333" stroke-width="0.5"/>
  <text x="271" y="196" font-family="monospace" font-size="11" fill="#FFF" text-anchor="middle">±</text>
  <rect x="304" y="175" width="48" height="34" rx="2" fill="#202020" stroke="#333" stroke-width="0.5"/>
  <text x="328" y="196" font-family="monospace" font-size="11" fill="#FFF" text-anchor="middle">%</text>
  <rect x="361" y="175" width="48" height="34" rx="2" fill="#303030" stroke="#444" stroke-width="0.5"/>
  <text x="385" y="196" font-family="monospace" font-size="12" fill="#FFF" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <rect x="190" y="217" width="48" height="34" rx="2" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="0.5"/>
  <text x="214" y="238" font-family="monospace" font-size="11" fill="#AAA" text-anchor="middle">7</text>
  <rect x="247" y="217" width="48" height="34" rx="2" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="0.5"/>
  <text x="271" y="238" font-family="monospace" font-size="11" fill="#AAA" text-anchor="middle">8</text>
  <rect x="304" y="217" width="48" height="34" rx="2" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="0.5"/>
  <text x="328" y="238" font-family="monospace" font-size="11" fill="#AAA" text-anchor="middle">9</text>
  <rect x="361" y="217" width="48" height="34" rx="2" fill="#303030" stroke="#444" stroke-width="0.5"/>
  <text x="385" y="238" font-family="monospace" font-size="12" fill="#FFF" text-anchor="middle">×</text>

  <!-- Row 3 -->
  <rect x="190" y="259" width="48" height="34" rx="2" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="0.5"/>
  <text x="214" y="280" font-family="monospace" font-size="11" fill="#AAA" text-anchor="middle">4</text>
  <rect x="247" y="259" width="48" height="34" rx="2" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="0.5"/>
  <text x="271" y="280" font-family="monospace" font-size="11" fill="#AAA" text-anchor="middle">5</text>
  <rect x="304" y="259" width="48" height="34" rx="2" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="0.5"/>
  <text x="328" y="280" font-family="monospace" font-size="11" fill="#AAA" text-anchor="middle">6</text>
  <rect x="361" y="259" width="48" height="34" rx="2" fill="#303030" stroke="#444" stroke-width="0.5"/>
  <text x="385" y="280" font-family="monospace" font-size="12" fill="#FFF" text-anchor="middle">−</text>

  <!-- Row 4 -->
  <rect x="190" y="301" width="105" height="34" rx="2" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="0.5"/>
  <text x="242" y="322" font-family="monospace" font-size="11" fill="#AAA" text-anchor="middle">0</text>
  <rect x="304" y="301" width="48" height="34" rx="2" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="0.5"/>
  <text x="328" y="322" font-family="monospace" font-size="11" fill="#AAA" text-anchor="middle">.</text>
  <rect x="361" y="301" width="48" height="34" rx="2" fill="#E8E8E3" stroke="#FFF" stroke-width="0.5"/>
  <text x="385" y="322" font-family="monospace" font-size="13" font-weight="bold" fill="#0A0A0A" text-anchor="middle">=</text>
</svg>

